[package]
name = "campus-core"
version = "0.1.0"
edition = "2021"

[dependencies]
pku-bdkj = { path = "../../vendor/pkucli/crates/bdkj" }
pku-course = { path = "../../vendor/pkucli/crates/course" }
pku-treehole = { path = "../../vendor/pkucli/crates/treehole" }
pku-campuscard = { path = "../../vendor/pkucli/crates/campuscard" }
pku-portal = { path = "../../vendor/pkucli/crates/portal" }
pkuinfo-common = { path = "../../vendor/pkucli/crates/common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
reqwest = { version = "0.12", features = ["cookies", "json", "stream"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
libc = "0.2"
url = "2"
regex = "1"
percent-encoding = "2"
rand = "0.8"
sha2 = "0.10"
directories = "5"
futures = "0.3"
tiny_http = "0.12"
mime_guess = "2"
scraper = "0.23"
ammonia = "4"
fs2 = "0.4"
trash = "5.2.7"
lopdf = "0.45.0"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service"] }

[dev-dependencies]
tempfile = "3"
